name: Check website availability

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check primary websites
        env:
          DOMAIN_MANAGER_URL: ${{ vars.DOMAIN_MANAGER_URL }}
          DOMAIN_MANAGER_API_TOKEN: ${{ secrets.DOMAIN_MANAGER_API_TOKEN }}
        run: node scripts/check-domain-status.mjs
